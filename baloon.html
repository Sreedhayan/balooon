<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Balloon Dodge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
      color: #fff; font-size: 16px; pointer-events: none; z-index: 10;
      background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
    }
    #hud .stat { text-align: center; }
    #hud .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    #hud .value { font-size: 22px; font-weight: bold; color: #fff; }
    #hud .value.power { color: #4f8; }
    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: rgba(5,5,20,0.85); z-index: 20;
      backdrop-filter: blur(4px);
    }
    #overlay.hidden { display: none; }
    #overlay h1 {
      font-size: 48px; color: #fff; margin-bottom: 8px;
      text-shadow: 0 0 20px #f0f, 0 0 40px #f0f;
    }
    #overlay .subtitle { color: #aaa; font-size: 16px; margin-bottom: 32px; }
    #overlay .final-score { font-size: 28px; color: #fff; margin-bottom: 4px; }
    #overlay .best { font-size: 16px; color: #4f8; margin-bottom: 24px; }
    #overlay button {
      padding: 14px 48px; font-size: 18px; font-weight: bold;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff; border: none; border-radius: 30px; cursor: pointer;
      box-shadow: 0 4px 20px rgba(168,85,247,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #overlay button:hover { transform: scale(1.05); box-shadow: 0 6px 28px rgba(168,85,247,0.6); }
    #overlay .hint { margin-top: 20px; font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <div id="hud">
    <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="stat"><div class="label">Speed</div><div class="value" id="speed">1x</div></div>
    <div class="stat"><div class="label">Power</div><div class="value power" id="power">--</div></div>
    <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
  </div>

  <div id="overlay">
    <h1>🎈 Balloon Dodge</h1>
    <div class="subtitle">Dodge spikes & blocks, grab power-ups!</div>
    <button id="startBtn">PLAY</button>
    <div class="hint">Move mouse or drag to control the balloon</div>
  </div>

  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const scoreEl = document.getElementById('score');
    const speedEl = document.getElementById('speed');
    const powerEl = document.getElementById('power');
    const bestEl = document.getElementById('best');
    const startBtn = document.getElementById('startBtn');

    let W, H;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // --- State ---
    let balloon, obstacles, powerUps, particles, stars;
    let score, frame, speed, gameRunning, animId;
    let mouseY, inputActive;
    let bestScore = parseInt(localStorage.getItem('balloonBest') || '0');
    bestEl.textContent = bestScore;

    // --- Init ---
    function init() {
      balloon = { x: 80, y: H / 2, r: 22, shield: false, shieldTime: 0 };
      obstacles = [];
      powerUps = [];
      particles = [];
      stars = Array.from({ length: 80 }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.5 + 0.5, twinkle: Math.random() * Math.PI * 2
      }));
      score = 0; frame = 0; speed = 3;
      mouseY = H / 2; inputActive = false;
      updateHUD();
    }

    function startGame() {
      init();
      overlay.classList.add('hidden');
      gameRunning = true;
      loop();
    }

    // --- Input ---
    document.addEventListener('mousemove', e => { mouseY = e.clientY; inputActive = true; });
    document.addEventListener('touchmove', e => {
      e.preventDefault();
      mouseY = e.touches[0].clientY;
      inputActive = true;
    }, { passive: false });
    document.addEventListener('touchstart', e => {
      mouseY = e.touches[0].clientY;
      inputActive = true;
    });

    startBtn.addEventListener('click', startGame);

    // --- Spawners ---
    function spawnObstacle() {
      const type = Math.random() < 0.45 ? 'spike' : 'block';
      const size = 30 + Math.random() * 40;
      const side = Math.random() < 0.5 ? 1 : -1;
      obstacles.push({
        x: W + 60, y: Math.random() * (H - 60) + 30,
        w: size, h: size, type,
        vy: side * (1 + Math.random() * 2),
        rot: 0, rotSpeed: (Math.random() - 0.5) * 0.05
      });
    }

    function spawnPowerUp() {
      const types = ['shield', 'slow', 'points'];
      powerUps.push({
        x: W + 40, y: Math.random() * (H - 40) + 20,
        r: 14, type: types[Math.floor(Math.random() * types.length)],
        pulse: 0
      });
    }

    function spawnParticles(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
        const spd = 2 + Math.random() * 3;
        particles.push({ x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd,
          life: 1, color, r: 3 + Math.random() * 3 });
      }
    }

    // --- Draw helpers ---
    function drawBalloon(x, y, r, shield) {
      ctx.save();
      // Glow
      const glow = ctx.createRadialGradient(x, y, r * 0.3, x, y, r * 2);
      glow.addColorStop(0, shield ? 'rgba(0,255,100,0.3)' : 'rgba(255,100,100,0.3)');
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(x, y, r * 2, 0, Math.PI * 2); ctx.fill();

      // Balloon body
      const grad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
      if (shield) {
        grad.addColorStop(0, '#aaffcc'); grad.addColorStop(1, '#00aa55');
      } else {
        grad.addColorStop(0, '#ffcccc'); grad.addColorStop(1, '#ee3333');
      }
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();

      // Highlight
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.arc(x - r * 0.25, y - r * 0.3, r * 0.3, 0, Math.PI * 2); ctx.fill();

      // Shield ring
      if (shield) {
        ctx.strokeStyle = 'rgba(0,255,100,0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, r + 8, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }

    function drawObstacle(o) {
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(o.rot);
      if (o.type === 'spike') {
        ctx.fillStyle = '#ff6b6b';
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(0, -o.h / 2);
        ctx.lineTo(o.w / 2, o.h / 2);
        ctx.lineTo(-o.w / 2, o.h / 2);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillStyle = '#aa44ff';
        ctx.shadowColor = '#8800ff';
        ctx.shadowBlur = 8;
        ctx.fillRect(-o.w / 2, -o.h / 2, o.w, o.h);
        ctx.strokeStyle = '#cc88ff';
        ctx.lineWidth = 1;
        ctx.strokeRect(-o.w / 2, -o.h / 2, o.w, o.h);
      }
      ctx.restore();
    }

    function drawPowerUp(p) {
      ctx.save();
      p.pulse += 0.1;
      const pulseR = p.r + Math.sin(p.pulse) * 3;
      const colors = { shield: '#00ff88', slow: '#4488ff', points: '#ffdd00' };
      const labels = { shield: 'S', slow: '<<', points: '+100' };
      ctx.shadowColor = colors[p.type];
      ctx.shadowBlur = 12;
      ctx.fillStyle = colors[p.type];
      ctx.beginPath(); ctx.arc(p.x, p.y, pulseR, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(labels[p.type], p.x, p.y);
      ctx.restore();
    }

    function drawStar(s) {
      s.twinkle += 0.02;
      const alpha = 0.4 + Math.sin(s.twinkle) * 0.3;
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }

    function drawParticle(p) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // --- Update ---
    function update() {
      if (!gameRunning) return;
      frame++;

      // Smooth follow
      if (inputActive) balloon.y += (mouseY - balloon.y) * 0.12;
      balloon.y = Math.max(balloon.r, Math.min(H - balloon.r, balloon.y));

      // Spawn
      if (frame % Math.max(25, 55 - Math.floor(speed * 2)) === 0) spawnObstacle();
      if (frame % 400 === 0) spawnPowerUp();

      // Shield timer
      if (balloon.shield) {
        balloon.shieldTime--;
        if (balloon.shieldTime <= 0) balloon.shield = false;
      }

      // Obstacles
      for (let o of obstacles) {
        o.x -= speed;
        o.y += o.vy;
        o.rot += o.rotSpeed;
        if (o.y < o.h / 2 || o.y > H - o.h / 2) o.vy *= -1;
      }
      obstacles = obstacles.filter(o => o.x > -80);

      // Power-ups
      for (let p of powerUps) p.x -= speed;
      powerUps = powerUps.filter(p => p.x > -30);

      // Particles
      for (let p of particles) {
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.96; p.vy *= 0.96;
        p.life -= 0.03;
      }
      particles = particles.filter(p => p.life > 0);

      // Collision - obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        const dx = balloon.x - o.x, dy = balloon.y - o.y;
        const hitDist = o.type === 'spike' ? balloon.r + o.h * 0.4 : balloon.r + o.w / 2;
        if (Math.hypot(dx, dy) < hitDist) {
          if (balloon.shield) {
            balloon.shield = false;
            spawnParticles(o.x, o.y, '#00ff88', 12);
            obstacles.splice(i, 1);
          } else {
            gameOver();
            return;
          }
        }
      }

      // Collision - power-ups
      for (let i = powerUps.length - 1; i >= 0; i--) {
        const p = powerUps[i];
        if (Math.hypot(balloon.x - p.x, balloon.y - p.y) < balloon.r + p.r) {
          spawnParticles(p.x, p.y, p.type === 'shield' ? '#00ff88' : p.type === 'slow' ? '#4488ff' : '#ffdd00', 10);
          if (p.type === 'shield') { balloon.shield = true; balloon.shieldTime = 300; }
          else if (p.type === 'slow') { speed = Math.max(2, speed - 1); setTimeout(() => { if (gameRunning) speed++; }, 5000); }
          else score += 100;
          powerUps.splice(i, 1);
        }
      }

      score++;
      if (frame % 600 === 0) speed++;
      updateHUD();
    }

    function updateHUD() {
      scoreEl.textContent = score;
      speedEl.textContent = speed + 'x';
      powerEl.textContent = balloon.shield ? Math.ceil(balloon.shieldTime / 60) + 's' : '--';
    }

    function gameOver() {
      gameRunning = false;
      cancelAnimationFrame(animId);
      spawnParticles(balloon.x, balloon.y, '#ff4444', 20);
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('balloonBest', bestScore);
      }
      bestEl.textContent = bestScore;
      setTimeout(() => {
        overlay.querySelector('h1').textContent = 'Game Over';
        overlay.querySelector('.subtitle').textContent = '';
        const fs = overlay.querySelector('.final-score');
        const bt = overlay.querySelector('.best');
        if (!fs) {
          overlay.insertAdjacentHTML('beforeend', '<div class="final-score">Score: ' + score + '</div><div class="best">Best: ' + bestScore + '</div>');
        } else {
          fs.textContent = 'Score: ' + score;
          bt.textContent = 'Best: ' + bestScore;
        }
        startBtn.textContent = 'PLAY AGAIN';
        overlay.classList.remove('hidden');
      }, 500);
    }

    // --- Render ---
    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Background gradient
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#0a0a1a'); bg.addColorStop(1, '#1a1030');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Stars
      stars.forEach(drawStar);

      // Particles
      particles.forEach(drawParticle);

      // Game objects
      obstacles.forEach(drawObstacle);
      powerUps.forEach(drawPowerUp);
      if (gameRunning) drawBalloon(balloon.x, balloon.y, balloon.r, balloon.shield);
    }

    function loop() {
      update();
      draw();
      if (gameRunning) animId = requestAnimationFrame(loop);
      else draw(); // final frame with particles
    }

    // Initial draw
    init();
    draw();
  </script>
</body>
</html>
